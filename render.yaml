services:
  - type: web
    name: my-stores-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    disk:
      name: my-stores-h2-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
