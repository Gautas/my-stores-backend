projects:
  - name: My Stores Dev
    environments:
      - name: Development
        networking:
          isolation: enabled
        services:
          - type: web
            name: my-stores-dev-api
            repo: https://github.com/Gautas/my-stores-backend
            branch: main
            runtime: docker
            plan: free
            dockerfilePath: ./Dockerfile
            dockerContext: .
            envVars:
              - key: SPRING_PROFILES_ACTIVE
                value: dev
              - key: APP_ENV
                value: dev
              - key: OWNER_EMAIL
                value: prabhanshu605+dev@gmail.com
              - key: OWNER_PASSWORD
                sync: false
              - key: SESSION_SECRET
                generateValue: true
              - key: FRONTEND_URL
                value: https://my-stores-dev-web-596c.onrender.com
              - key: RESET_BASE_URL
                value: https://my-stores-dev-web-596c.onrender.com
              - key: OPENAI_API_KEY
                sync: false
          - type: web
            runtime: static
            name: my-stores-dev-web
            repo: https://github.com/Gautas/my-stores-frontend
            branch: main
            buildCommand: npm install && node -e "require('fs').writeFileSync('src/api-config.ts', 'export const API_URL = '+JSON.stringify(process.env.API_URL)+';')" && npm run build -- --configuration=${ANGULAR_CONFIGURATION:-development}
            staticPublishPath: dist/my-stores/browser
            envVars:
              - key: API_URL
                value: https://my-stores-dev-api-596c.onrender.com/api
              - key: ANGULAR_CONFIGURATION
                value: development

