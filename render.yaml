services:
  - type: web
    name: my-stores-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    disk:
      name: my-stores-h2-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_ENV
        value: prod
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OWNER_NAME
        value: Store owner
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESET_TOKEN_MINUTES
        value: "15"
      - key: RESET_BASE_URL
        value: https://stores-ebaf.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
