server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/mystores;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.owner.email=${OWNER_EMAIL:owner@mystores.local}
app.owner.password=${OWNER_PASSWORD:change-me-now}
app.owner.name=${OWNER_NAME:Store owner}
app.cors.origin=${FRONTEND_URL:http://localhost:4200},https://stores-ebaf.onrender.com
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-4o-mini}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${SMTP_USERNAME:}}
app.security.reset-base-url=${RESET_BASE_URL:https://stores-ebaf.onrender.com}
app.security.reset-minutes=${RESET_TOKEN_MINUTES:15}
